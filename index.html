<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Precificação</title>

    <!-- Fontes Oficiais (Montserrat) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,700&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Montserrat', 'sans-serif'] },
                    colors: {
                        'ufabc-dark': '#2A2A2A',
                        'ufabc-green': '#0B4F3A',
                        'ufabc-green-light': '#127355',
                        'ufabc-yellow': '#FBBF24',
                        'ufabc-yellow-hover': '#F59E0B',
                        'ufabc-bg': '#F8F9F5',
                        'col-diag': '#3B82F6',   
                        'col-alin': '#D97706',   
                        'col-prop': '#10B981',   
                        'col-nego': '#F59E0B',   
                        'col-cont': '#8B5CF6',   
                    }
                }
            }
        }
    </script>

    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script>
        Babel.registerPreset('env-react-classic', {
            presets: [ Babel.availablePresets['env'], [Babel.availablePresets['react'], { runtime: 'classic' }] ]
        });
    </script>

    <!-- INTEGRAÇÃO FIREBASE -->

        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot, doc, updateDoc, addDoc, setDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

        // Suas chaves reais do Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyCz6mf9JczMehau6yHJ_uxZFzLxl1hNdso",
            authDomain: "site-do-funil-de-vendas.firebaseapp.com",
            projectId: "site-do-funil-de-vendas",
            storageBucket: "site-do-funil-de-vendas.firebasestorage.app",
            messagingSenderId: "240502835468",
            appId: "1:240502835468:web:dd392e3f420ec3792d2129"
        };

        try {
            const app = initializeApp(firebaseConfig);
            const db = getFirestore(app);
            window.db = db; window.collection = collection; window.onSnapshot = onSnapshot; window.doc = doc; window.updateDoc = updateDoc; window.addDoc = addDoc; window.setDoc = setDoc; window.deleteDoc = deleteDoc;
            console.log("🔥 Firebase inicializado com sucesso!");
        } catch (error) { 
            console.error("Erro Firebase:", error); 
        }
    </script>

    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .kanban-scroll::-webkit-scrollbar { height: 10px; width: 10px; }
        .kanban-scroll::-webkit-scrollbar-track { background: rgba(11, 79, 58, 0.05); border-radius: 10px; }
        .kanban-scroll::-webkit-scrollbar-thumb { background: rgba(11, 79, 58, 0.2); border-radius: 10px; }
        .kanban-scroll::-webkit-scrollbar-thumb:hover { background: rgba(11, 79, 58, 0.4); }

        html { scroll-behavior: smooth; }
        
        body {
            background-color: #F8F9F5;
            background-image: 
                linear-gradient(to right, rgba(11, 79, 58, 0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(11, 79, 58, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        .dragging { opacity: 0.5; transform: scale(0.95); }
    </style>
</head>
<body class="text-slate-800 antialiased selection:bg-ufabc-yellow selection:text-ufabc-dark overflow-hidden h-screen">
    
    <div id="root" class="h-full"></div>

    <script type="text/babel" data-presets="env-react-classic">
        const { useState, useMemo, useEffect, useCallback } = React;

        const getDaysMessage = (dateString) => {
            if (!dateString) return null;
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const targetDate = new Date(dateString + 'T00:00:00');
            const diffTime = targetDate - today;
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
            
            if (diffDays < 0) return { text: `Atrasado há ${Math.abs(diffDays)} dia(s)`, color: 'text-red-500', icon: 'fa-triangle-exclamation' };
            if (diffDays === 0) return { text: 'Retornar Hoje', color: 'text-ufabc-yellow-hover', icon: 'fa-bell' };
            if (diffDays === 1) return { text: 'Retornar Amanhã', color: 'text-slate-500', icon: 'fa-clock' };
            return { text: `Retorno em ${diffDays} dias`, color: 'text-slate-500', icon: 'fa-clock' };
        };

        const stringToColor = (str) => {
            let hash = 0;
            for (let i = 0; i < str.length; i++) hash = str.charCodeAt(i) + ((hash << 5) - hash);
            return `hsl(${hash % 360}, 60%, 40%)`;
        };

        const getInitials = (name) => {
            if (!name) return "?";
            const parts = name.split(' ');
            if (parts.length >= 2) return (parts[0][0] + parts[1][0]).toUpperCase();
            return name.substring(0, 2).toUpperCase();
        };

        const COLUMNS = [
            { id: 'diagnostica', title: 'Diagnóstica', color: 'bg-col-diag', text: 'text-col-diag' },
            { id: 'alinhamento', title: 'Alinhamento', color: 'bg-col-alin', text: 'text-col-alin' },
            { id: 'proposta', title: 'Proposta', color: 'bg-col-prop', text: 'text-col-prop' },
            { id: 'negociacao', title: 'Negociação', color: 'bg-col-nego', text: 'text-col-nego' },
            { id: 'contrato', title: 'Contrato', color: 'bg-col-cont', text: 'text-col-cont' },
            { id: 'perdido', title: 'Saíram do Funil', color: 'bg-red-500', text: 'text-red-500' },
        ];

        const SERVICE_TYPES = [
            'Pesquisa Secundária', 
            'Pesquisa Primária', 
            'Mapeamento de Processos', 
            'Estruturação Comercial', 
            'Gestão de Mídias', 
            'Serviço de Dados', 
            'Outro'
        ];

        const LOST_REASONS = ['Preço', 'Concorrente', 'Escopo/Momento', 'Sem Resposta', 'Outro'];

        const INITIAL_LEADS = [
            { id: '1', columnId: 'diagnostica', company: 'Lead Exemplo (Local)', participants: [], proposalLink: '', journeyLink: '', notes: '', serviceType: 'Outro', followUpDate: '' },
        ];

        const LogoUFABC = ({ isDarkBg = true, className = "text-xl sm:text-2xl" }) => (
            <div className={`font-black tracking-tighter flex items-baseline select-none ${className} ${isDarkBg ? 'text-white' : 'text-ufabc-dark'}`}>
                <span>UFABC</span>
                <span className="text-ufabc-yellow ml-1 italic font-bold text-[0.8em]">jr.</span>
            </div>
        );

        const ParticipantBadge = ({ participant, showName = true, className = "" }) => (
            <div className={`flex items-center gap-2 ${className}`}>
                <div className="w-6 h-6 rounded-full flex items-center justify-center text-[10px] font-bold text-white shadow-sm flex-shrink-0" style={{ backgroundColor: stringToColor(participant.name) }} title={participant.name}>
                    {getInitials(participant.name)}
                </div>
                {showName && <span className="text-sm font-medium text-slate-600 truncate">{participant.name}</span>}
            </div>
        );

        const StepperControl = ({ value, onChange, min = 0, step = 1, suffix = '', prefix = '' }) => (
            <div className="flex items-center bg-white border border-slate-200 rounded-xl overflow-hidden hover:border-ufabc-green transition-colors shadow-sm w-full sm:w-auto">
                <button onClick={() => onChange(Math.max(min, Number(value) - step))} className="w-10 h-10 flex items-center justify-center bg-slate-50 hover:bg-slate-200 text-slate-500 hover:text-ufabc-green font-black border-r border-slate-200 transition-all cursor-pointer select-none">
                    <i className="fa-solid fa-minus text-[10px]"></i>
                </button>
                <div className="flex-1 flex items-center justify-center px-3 min-w-[3.5rem]">
                    <span className="text-sm font-black text-slate-700 select-none tracking-tight">{prefix}{value}{suffix}</span>
                </div>
                <button onClick={() => onChange(Number(value) + step)} className="w-10 h-10 flex items-center justify-center bg-slate-50 hover:bg-slate-200 text-slate-500 hover:text-ufabc-green font-black border-l border-slate-200 transition-all cursor-pointer select-none">
                    <i className="fa-solid fa-plus text-[10px]"></i>
                </button>
            </div>
        );

        const CRMView = ({ leads, saveLeadToDB, deleteLeadFromDB, onNavigateToPricing }) => {
            const [draggedLeadId, setDraggedLeadId] = useState(null);
            const [activeColId, setActiveColId] = useState(null);
            const [activeFilter, setActiveFilter] = useState('Todos');
            const [activeParticipantFilter, setActiveParticipantFilter] = useState('Todos');
            const [searchQuery, setSearchQuery] = useState('');
            
            const [selectedLead, setSelectedLead] = useState(null);
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [newParticipantName, setNewParticipantName] = useState("");
            const [newParticipantEmail, setNewParticipantEmail] = useState("");
            const [showDeleteConfirm, setShowDeleteConfirm] = useState(false);

            const handleDragStart = (e, leadId) => { setDraggedLeadId(leadId); setTimeout(() => e.target.classList.add('dragging'), 0); };
            const handleDragEnd = (e) => { e.target.classList.remove('dragging'); setDraggedLeadId(null); setActiveColId(null); };
            const handleDragOver = (e, colId) => { e.preventDefault(); if (activeColId !== colId) setActiveColId(colId); };
            const handleDrop = (e, colId) => {
                e.preventDefault(); setActiveColId(null);
                if (draggedLeadId) {
                    const lead = leads.find(l => l.id === draggedLeadId);
                    if (lead && lead.columnId !== colId) saveLeadToDB({ ...lead, columnId: colId });
                }
            };

            const openModal = (lead) => { setSelectedLead({ ...lead }); setIsModalOpen(true); setShowDeleteConfirm(false); };
            const closeModal = () => { setIsModalOpen(false); setShowDeleteConfirm(false); setTimeout(() => setSelectedLead(null), 300); };
            const saveLeadDetails = () => { saveLeadToDB(selectedLead); closeModal(); };

            const handleGerarOrcamento = () => {
                saveLeadToDB(selectedLead); // Salva o status antes de ir
                onNavigateToPricing(selectedLead.id, selectedLead.company, selectedLead.serviceType);
                setIsModalOpen(false);
                setSelectedLead(null);
            };

            const handleAddParticipant = (e) => {
                if (e.key === 'Enter' && newParticipantName.trim() !== '') {
                    e.preventDefault();
                    const newP = { id: Date.now().toString(), name: newParticipantName.trim(), email: newParticipantEmail.trim() };
                    setSelectedLead(prev => ({ ...prev, participants: [...(prev.participants||[]), newP] }));
                    setNewParticipantName(""); setNewParticipantEmail("");
                }
            };

            const removeParticipant = (idToRemove) => setSelectedLead(prev => ({ ...prev, participants: prev.participants.filter(p => p.id !== idToRemove) }));

            const createNewLead = () => {
                const newLead = {
                    id: Date.now().toString(), columnId: 'diagnostica', company: 'Novo Lead', participants: [],
                    proposalLink: '', journeyLink: '', notes: '', serviceType: '', followUpDate: '', lostReason: ''
                };
                saveLeadToDB(newLead, true);
                openModal(newLead);
            };

            const uniqueParticipants = useMemo(() => {
                const names = new Set();
                leads.forEach(lead => (lead.participants||[]).forEach(p => names.add(p.name)));
                return Array.from(names).sort();
            }, [leads]);

            const filteredLeads = leads.filter(lead => {
                const matchService = activeFilter === 'Todos' || lead.serviceType === activeFilter;
                const matchSearch = lead.company.toLowerCase().includes(searchQuery.toLowerCase());
                const matchParticipant = activeParticipantFilter === 'Todos' || (lead.participants||[]).some(p => p.name === activeParticipantFilter);
                return matchService && matchSearch && matchParticipant;
            });

            return (
                <div className="h-full flex flex-col relative bg-ufabc-bg">
                    {/* Barra de Filtros */}
                    <div className="px-6 py-4 flex flex-wrap xl:flex-nowrap gap-3 w-full border-b border-slate-200 bg-white/50 backdrop-blur flex-shrink-0 relative z-10">
                        <div className="relative group flex-1 sm:flex-none min-w-[150px]">
                            <select value={activeFilter} onChange={(e) => setActiveFilter(e.target.value)} className="w-full appearance-none px-4 py-2.5 pr-8 rounded-xl bg-white text-slate-700 hover:bg-slate-50 transition-colors outline-none cursor-pointer text-sm font-bold border border-slate-200 focus:border-ufabc-green shadow-sm">
                                <option value="Todos">Todos os Serviços</option>
                                {SERVICE_TYPES.map(type => <option key={type} value={type}>{type}</option>)}
                            </select>
                            <i className="fa-solid fa-chevron-down absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none text-xs"></i>
                        </div>

                        <div className="relative group flex-1 sm:flex-none min-w-[150px]">
                            <select value={activeParticipantFilter} onChange={(e) => setActiveParticipantFilter(e.target.value)} className="w-full appearance-none px-4 py-2.5 pr-8 rounded-xl bg-white text-slate-700 hover:bg-slate-50 transition-colors outline-none cursor-pointer text-sm font-bold border border-slate-200 focus:border-ufabc-green shadow-sm">
                                <option value="Todos">Todos os Membros</option>
                                {uniqueParticipants.map(name => <option key={name} value={name}>{name}</option>)}
                            </select>
                            <i className="fa-solid fa-chevron-down absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none text-xs"></i>
                        </div>
                        
                        <div className="relative group flex-1 sm:flex-none min-w-[150px]">
                            <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400"><i className="fa-solid fa-magnifying-glass text-xs"></i></div>
                            <input type="text" placeholder="Buscar empresa..." value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} className="w-full xl:w-64 pl-9 pr-4 py-2.5 rounded-xl bg-white text-slate-700 hover:bg-slate-50 focus:bg-white transition-colors outline-none text-sm font-medium border border-slate-200 focus:border-ufabc-green shadow-sm" />
                        </div>
                        
                        <button onClick={createNewLead} className="flex-1 sm:flex-none px-5 py-2.5 bg-ufabc-yellow text-ufabc-dark font-black rounded-xl hover:bg-ufabc-yellow-hover transition-colors shadow-sm shadow-ufabc-yellow/20 flex items-center justify-center gap-2">
                            <i className="fa-solid fa-plus"></i> Novo Lead
                        </button>
                    </div>

                    {/* Board Kanban */}
                    <div className="flex-1 overflow-x-auto overflow-y-hidden kanban-scroll p-6 relative z-10">
                        <div className="flex gap-6 h-full items-start min-w-max pb-4">
                            {COLUMNS.map(col => {
                                const colLeads = filteredLeads.filter(l => l.columnId === col.id);
                                const isOver = activeColId === col.id;

                                return (
                                    <div key={col.id} className={`w-80 flex flex-col h-full bg-slate-200/40 rounded-2xl border border-slate-200/60 transition-colors ${isOver ? 'bg-slate-300/60 border-slate-300 shadow-inner' : ''}`} onDragOver={(e) => handleDragOver(e, col.id)} onDrop={(e) => handleDrop(e, col.id)}>
                                        <div className="p-4 pb-2 flex items-center justify-between flex-shrink-0">
                                            <div className="flex items-center gap-2"><div className={`w-3 h-3 rounded-full ${col.color} shadow-sm`}></div><h3 className={`font-bold text-sm tracking-wide ${col.text}`}>{col.title}</h3><span className="text-xs font-bold text-slate-400 ml-1">{colLeads.length}</span></div>
                                        </div>

                                        <div className="p-3 flex-1 overflow-y-auto space-y-3 no-scrollbar">
                                            {colLeads.map(lead => (
                                                <div key={lead.id} draggable onDragStart={(e) => handleDragStart(e, lead.id)} onDragEnd={handleDragEnd} onClick={() => openModal(lead)} className="bg-white p-4 rounded-xl shadow-sm border border-slate-100 cursor-grab active:cursor-grabbing hover:border-ufabc-green/30 transition-all hover:-translate-y-0.5 group">
                                                    <div className="flex justify-between items-start mb-2"><h4 className="font-bold text-slate-700 text-sm flex items-center gap-2"><i className="fa-regular fa-file-lines text-slate-400 group-hover:text-ufabc-green transition-colors"></i>{lead.company}</h4></div>
                                                    
                                                    {lead.serviceType && (
                                                        <div className="mb-3"><span className="inline-block px-2 py-0.5 bg-slate-100 text-slate-500 text-[9px] font-bold uppercase tracking-wider rounded">{lead.serviceType}</span></div>
                                                    )}
                                                    
                                                    {(lead.participants||[]).length > 0 && (
                                                        <div className="flex flex-wrap gap-x-3 gap-y-2 mt-2">
                                                            {lead.participants.map(p => (
                                                                <div key={p.id} className="flex items-center gap-1.5" title={p.name}>
                                                                    <div className="w-4 h-4 rounded-full flex items-center justify-center text-[8px] font-bold text-white flex-shrink-0" style={{ backgroundColor: stringToColor(p.name) }}>{getInitials(p.name)}</div>
                                                                    <span className="text-[11px] font-medium text-slate-500 truncate max-w-[120px]">{p.name}</span>
                                                                </div>
                                                            ))}
                                                        </div>
                                                    )}

                                                    <div className="mt-3 flex items-center justify-between pt-2 border-t border-slate-50">
                                                        {lead.followUpDate ? (
                                                            <div className="flex items-center gap-1.5"><i className={`fa-solid ${getDaysMessage(lead.followUpDate).icon} text-[10px] ${getDaysMessage(lead.followUpDate).color}`}></i><span className={`text-[10px] font-bold ${getDaysMessage(lead.followUpDate).color}`}>{getDaysMessage(lead.followUpDate).text}</span></div>
                                                        ) : <div></div>}
                                                        
                                                        {lead.savedPricing && <i className="fa-solid fa-calculator text-ufabc-green text-xs" title="Orçamento Salvo"></i>}
                                                    </div>

                                                    {(lead.proposalLink || lead.journeyLink) && (
                                                        <div className="mt-3 flex gap-2 border-t border-slate-50 pt-2">
                                                            {lead.proposalLink && <i className="fa-solid fa-file-pdf text-[10px] text-green-500 bg-green-50 p-1.5 rounded" title="Proposta Anexada"></i>}
                                                            {lead.journeyLink && <i className="fa-solid fa-file-excel text-[10px] text-blue-500 bg-blue-50 p-1.5 rounded" title="Jornada Anexada"></i>}
                                                        </div>
                                                    )}
                                                </div>
                                            ))}
                                            <div className="h-10 w-full"></div>
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    </div>

                    <datalist id="membros-sugestoes">
                        {uniqueParticipants.map(name => <option key={name} value={name} />)}
                    </datalist>

                    {/* Modal do Lead */}
                    {isModalOpen && selectedLead && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 sm:p-6 animate-in fade-in duration-200">
                            <div className="absolute inset-0 bg-slate-900/60 backdrop-blur-sm" onClick={closeModal}></div>
                            <div className="relative bg-white w-full max-w-5xl max-h-[90vh] rounded-3xl shadow-2xl flex flex-col overflow-hidden animate-in zoom-in-95 duration-300">
                                
                                <div className="px-8 py-5 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                                    <div className="flex items-center gap-4 flex-1">
                                        <select 
                                            value={selectedLead.columnId} 
                                            onChange={(e) => setSelectedLead({...selectedLead, columnId: e.target.value})}
                                            className={`px-3 py-1.5 rounded-full text-[10px] uppercase tracking-widest font-bold outline-none cursor-pointer border border-transparent hover:border-slate-300 ${COLUMNS.find(c => c.id === selectedLead.columnId)?.color} bg-opacity-20 ${COLUMNS.find(c => c.id === selectedLead.columnId)?.text}`}
                                        >
                                            {COLUMNS.map(c => <option key={c.id} value={c.id}>{c.title}</option>)}
                                        </select>
                                        <input type="text" value={selectedLead.company} onChange={(e) => setSelectedLead({...selectedLead, company: e.target.value})} className="text-2xl font-black text-ufabc-dark bg-transparent border-none outline-none focus:ring-0 flex-1 hover:bg-slate-200/50 rounded px-2 py-1 transition-colors" placeholder="Nome da Empresa" />
                                    </div>
                                    <div className="flex items-center gap-2">
                                        {!showDeleteConfirm ? (
                                            <button onClick={() => setShowDeleteConfirm(true)} className="w-10 h-10 flex items-center justify-center text-slate-400 hover:bg-red-50 hover:text-red-500 rounded-full transition-colors mr-2" title="Apagar Lead">
                                                <i className="fa-solid fa-trash-can"></i>
                                            </button>
                                        ) : (
                                            <div className="flex items-center bg-red-50 rounded-full pr-1 mr-2 animate-in slide-in-from-right-4">
                                                <span className="text-xs font-bold text-red-600 px-3">Apagar?</span>
                                                <button onClick={() => { deleteLeadFromDB(selectedLead.id); closeModal(); }} className="w-8 h-8 flex items-center justify-center bg-red-500 text-white hover:bg-red-600 rounded-full transition-colors shadow-sm">
                                                    <i className="fa-solid fa-check text-xs"></i>
                                                </button>
                                                <button onClick={() => setShowDeleteConfirm(false)} className="w-8 h-8 flex items-center justify-center text-slate-400 hover:text-slate-600 rounded-full transition-colors">
                                                    <i className="fa-solid fa-xmark text-xs"></i>
                                                </button>
                                            </div>
                                        )}
                                        <button onClick={saveLeadDetails} className="px-5 py-2 bg-ufabc-green text-white text-sm font-bold rounded-xl hover:bg-ufabc-green-light transition-colors shadow-md">Salvar</button>
                                        <button onClick={closeModal} className="w-10 h-10 flex items-center justify-center text-slate-400 hover:bg-slate-200 hover:text-slate-700 rounded-full transition-colors"><i className="fa-solid fa-xmark text-lg"></i></button>
                                    </div>
                                </div>

                                <div className="p-8 overflow-y-auto flex-1 bg-white grid grid-cols-1 xl:grid-cols-5 gap-8">
                                    <div className="xl:col-span-3 space-y-6">
                                        
                                        {/* Alerta de Motivo de Perda */}
                                        {selectedLead.columnId === 'perdido' && (
                                            <div className="bg-red-50 border border-red-200 p-4 rounded-2xl flex items-start gap-4 animate-in fade-in">
                                                <i className="fa-solid fa-triangle-exclamation text-red-500 mt-1"></i>
                                                <div className="flex-1">
                                                    <label className="block text-xs font-bold text-red-700 uppercase tracking-widest mb-2">Motivo da Perda</label>
                                                    <select 
                                                        value={selectedLead.lostReason || ""} 
                                                        onChange={(e) => setSelectedLead({...selectedLead, lostReason: e.target.value})}
                                                        className="w-full bg-white border border-red-200 rounded-xl p-2.5 text-sm outline-none text-red-900 cursor-pointer"
                                                    >
                                                        <option value="" disabled>Selecione o motivo principal...</option>
                                                        {LOST_REASONS.map(r => <option key={r} value={r}>{r}</option>)}
                                                    </select>
                                                </div>
                                            </div>
                                        )}

                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                            <section>
                                                <h3 className="text-xs font-bold text-slate-400 uppercase tracking-widest mb-3 flex items-center gap-2"><i className="fa-solid fa-tag"></i> Serviço</h3>
                                                <select value={selectedLead.serviceType || ""} onChange={(e) => setSelectedLead({...selectedLead, serviceType: e.target.value})} className="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm outline-none focus:ring-2 focus:ring-ufabc-green cursor-pointer">
                                                    <option value="" disabled>Selecione...</option>
                                                    {SERVICE_TYPES.map(type => <option key={type} value={type}>{type}</option>)}
                                                </select>
                                            </section>
                                            <section>
                                                <h3 className="text-xs font-bold text-slate-400 uppercase tracking-widest mb-3 flex items-center gap-2"><i className="fa-regular fa-calendar-check"></i> Retorno</h3>
                                                <input type="date" value={selectedLead.followUpDate || ""} onChange={(e) => setSelectedLead({...selectedLead, followUpDate: e.target.value})} className="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm outline-none focus:ring-2 focus:ring-ufabc-green text-center cursor-pointer" />
                                            </section>
                                        </div>

                                        <section>
                                            <h3 className="text-xs font-bold text-slate-400 uppercase tracking-widest mb-3 flex items-center gap-2"><i className="fa-solid fa-users"></i> Participantes</h3>
                                            <div className="bg-slate-50 border border-slate-200 rounded-2xl p-2">
                                                <div className="space-y-1 max-h-40 overflow-y-auto p-2 no-scrollbar">
                                                    {(selectedLead.participants||[]).map(p => (
                                                        <div key={p.id} className="flex items-center justify-between p-2 hover:bg-white rounded-xl transition-colors group">
                                                            <div className="flex flex-col"><ParticipantBadge participant={p} />{p.email && <span className="text-[10px] text-slate-400 ml-8">{p.email}</span>}</div>
                                                            <button onClick={() => removeParticipant(p.id)} className="text-slate-300 hover:text-red-500 opacity-0 group-hover:opacity-100 transition-all px-2"><i className="fa-solid fa-trash-can text-xs"></i></button>
                                                        </div>
                                                    ))}
                                                    {(selectedLead.participants||[]).length === 0 && <p className="text-xs text-slate-400 p-2 italic">Nenhum adicionado.</p>}
                                                </div>
                                                <div className="mt-2 p-2 border-t border-slate-200 space-y-2">
                                                    <div className="flex items-center bg-white border border-slate-200 rounded-lg overflow-hidden focus-within:ring-2 focus-within:ring-ufabc-green">
                                                        <div className="pl-3 text-slate-400"><i className="fa-solid fa-user text-sm"></i></div>
                                                        <input 
                                                            type="text" 
                                                            list="membros-sugestoes"
                                                            value={newParticipantName} 
                                                            onChange={(e) => setNewParticipantName(e.target.value)} 
                                                            placeholder="Nome (com sugestão)..." 
                                                            className="w-full px-3 py-2 text-sm outline-none bg-transparent" 
                                                        />
                                                    </div>
                                                    <div className="flex items-center bg-white border border-slate-200 rounded-lg overflow-hidden focus-within:ring-2 focus-within:ring-ufabc-green">
                                                        <div className="pl-3 text-slate-400"><i className="fa-solid fa-envelope text-sm"></i></div>
                                                        <input type="email" value={newParticipantEmail} onChange={(e) => setNewParticipantEmail(e.target.value)} onKeyDown={handleAddParticipant} placeholder="E-mail (Tecle Enter)" className="w-full px-3 py-2 text-sm outline-none bg-transparent" />
                                                    </div>
                                                </div>
                                            </div>
                                        </section>

                                        <section>
                                            <h3 className="text-xs font-bold text-slate-400 uppercase tracking-widest mb-3 flex items-center gap-2"><i className="fa-solid fa-align-left"></i> Anotações</h3>
                                            <textarea value={selectedLead.notes || ""} onChange={(e) => setSelectedLead({...selectedLead, notes: e.target.value})} placeholder="Status, próximos passos..." className="w-full min-h-[100px] bg-slate-50 border border-slate-200 rounded-2xl p-4 text-sm outline-none focus:ring-2 focus:ring-ufabc-green resize-none"></textarea>
                                        </section>
                                    </div>

                                    <div className="xl:col-span-2 space-y-6">
                                        {/* Integração Carrinho/Precificação */}
                                        <div className="bg-[#EAF3F0] rounded-3xl p-6 border border-ufabc-green/20 shadow-sm relative overflow-hidden">
                                            <div className="flex justify-between items-center mb-6 border-b border-ufabc-green/10 pb-4 relative z-10">
                                                <h3 className="text-xs font-black text-ufabc-green uppercase tracking-widest flex items-center gap-2"><i className="fa-solid fa-calculator"></i> Orçamento</h3>
                                                <button onClick={handleGerarOrcamento} className="px-3 py-1.5 bg-white text-ufabc-green border border-ufabc-green/30 rounded-lg text-[10px] font-black uppercase hover:bg-ufabc-green hover:text-white transition-colors">
                                                    {selectedLead.savedPricing ? 'Editar' : 'Gerar Orçamento'}
                                                </button>
                                            </div>
                                            
                                            {selectedLead.savedPricing ? (
                                                <div className="relative z-10">
                                                    <div className="flex justify-between items-end mb-4">
                                                        <div><span className="block text-[10px] font-bold text-ufabc-green/60 uppercase">Valor Ideal (Módulos)</span><span className="text-2xl font-black text-ufabc-green">{selectedLead.savedPricing.ideal.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' })}</span></div>
                                                    </div>
                                                    <div className="space-y-1.5">
                                                        {(selectedLead.savedPricing.modules||[]).map((m, i) => (
                                                            <div key={i} className="flex justify-between text-[11px] font-medium bg-white/60 px-3 py-1.5 rounded-lg border border-white">
                                                                <span className="text-slate-600 truncate mr-2">{m.label}</span>
                                                                <span className="font-bold text-ufabc-green">{m.final.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' })}</span>
                                                            </div>
                                                        ))}
                                                    </div>
                                                </div>
                                            ) : (
                                                <div className="text-center py-8 bg-white/40 rounded-xl border border-dashed border-ufabc-green/30 relative z-10">
                                                    <i className="fa-solid fa-receipt text-2xl text-ufabc-green/30 mb-2"></i>
                                                    <p className="text-xs text-ufabc-green/70 font-bold">Nenhum orçamento anexado.</p>
                                                </div>
                                            )}
                                        </div>

                                        <div className="border border-slate-200 rounded-3xl p-6 shadow-sm">
                                            <h3 className="text-xs font-bold text-slate-500 uppercase tracking-widest mb-4 flex items-center gap-2"><i className="fa-solid fa-folder-open"></i> Arquivos</h3>
                                            <div className="space-y-4">
                                                <div>
                                                    <label className="block text-[10px] font-bold text-slate-400 mb-1">Proposta Comercial (Link)</label>
                                                    <input type="text" value={selectedLead.proposalLink || ""} onChange={(e) => setSelectedLead({...selectedLead, proposalLink: e.target.value})} className="w-full bg-slate-50 border border-slate-200 rounded-lg p-2.5 text-xs outline-none focus:border-ufabc-green" />
                                                </div>
                                                <div>
                                                    <label className="block text-[10px] font-bold text-slate-400 mb-1">Jornada do Cliente (Link)</label>
                                                    <input type="text" value={selectedLead.journeyLink || ""} onChange={(e) => setSelectedLead({...selectedLead, journeyLink: e.target.value})} className="w-full bg-slate-50 border border-slate-200 rounded-lg p-2.5 text-xs outline-none focus:border-ufabc-green" />
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const getEapTasks = (serviceId, s) => {
            const defaultConsultants = s.consultants || 3;
            if (serviceId === 'mapeamento') {
                const semanasColeta = Math.ceil((s.interviewees || 1) / 10);
                return [
                    { id: 'map_1', nivel2: 'Iniciação', nivel3: 'Ambientação e Kick-off', hours: 10, consultants: defaultConsultants },
                    { id: 'map_2', nivel2: 'Coleta', nivel3: 'Entrevistas', hours: semanasColeta * 10, consultants: defaultConsultants },
                    { id: 'map_3', nivel2: 'Análise', nivel3: 'Análise da Coleta', hours: 10, consultants: defaultConsultants },
                    { id: 'map_4', nivel2: 'AS/IS', nivel3: 'Construção Fluxograma', hours: 10, consultants: defaultConsultants },
                    { id: 'map_5', nivel2: 'AS/IS', nivel3: 'Construção Descritivo', hours: 10, consultants: defaultConsultants },
                    { id: 'map_6', nivel2: 'Melhorias', nivel3: 'Análise Estratégica', hours: 10, consultants: defaultConsultants },
                    { id: 'map_7', nivel2: 'TO-BE', nivel3: 'Fluxograma Final', hours: 10, consultants: defaultConsultants }
                ];
            }
            if (serviceId === 'pesquisa_secundaria') return [
                { id: 'ps_1', nivel2: 'Setup', nivel3: 'Ambientação', hours: 10, consultants: defaultConsultants },
                { id: 'ps_2', nivel2: 'Planejamento', nivel3: 'Escopo e Fontes', hours: 10, consultants: defaultConsultants },
                { id: 'ps_3', nivel2: 'Coleta', nivel3: 'Dados de Mercado', hours: 20, consultants: defaultConsultants },
                { id: 'ps_4', nivel2: 'Análise', nivel3: 'Cruzamento de Dados', hours: 10, consultants: defaultConsultants }
            ];
            if (serviceId === 'pesquisa_primaria') return [
                { id: 'pp_1', nivel2: 'Setup', nivel3: 'Planejamento', hours: 10, consultants: defaultConsultants },
                { id: 'pp_2', nivel2: 'Execução', nivel3: 'Coleta de Dados', hours: (s.semanasColeta || 2) * 10, consultants: defaultConsultants },
                { id: 'pp_3', nivel2: 'Processamento', nivel3: 'Entregáveis', hours: 20, consultants: defaultConsultants }
            ];
            if (serviceId === 'gestao_midias') return [
                { id: 'gm_1', nivel2: 'Setup', nivel3: 'Ambientação e Escopo', hours: 10, consultants: defaultConsultants },
                { id: 'gm_2', nivel2: 'Setup', nivel3: 'Pesquisa de Mercado', hours: 10, consultants: defaultConsultants },
                { id: 'gm_3', nivel2: 'Operação', nivel3: `Criação Posts`, hours: (s.postsPorSemana * 2) * s.mesesContrato * 4, consultants: defaultConsultants }, 
                { id: 'gm_4', nivel2: 'Operação', nivel3: 'Tráfego Pago', hours: s.trafegoPago === 'gm_trafegoSim' ? (10 * s.mesesContrato) : 0, consultants: defaultConsultants }
            ].filter(t => t.hours > 0);
            if (serviceId === 'servico_dados') return [
                { id: 'sd_1', nivel2: 'Setup', nivel3: 'Ambientação', hours: 10, consultants: defaultConsultants },
                { id: 'sd_2', nivel2: 'Preparação', nivel3: 'ETL', hours: 20, consultants: defaultConsultants },
                { id: 'sd_3', nivel2: 'Modelagem', nivel3: 'Análise', hours: 20, consultants: defaultConsultants },
                { id: 'sd_4', nivel2: 'BI', nivel3: 'Dashboards', hours: 20, consultants: defaultConsultants },
                { id: 'sd_5', nivel2: 'Finalização', nivel3: 'Elaboração do Relatório', hours: 10, consultants: defaultConsultants }
            ];
            if (serviceId === 'comercial') return [
                { id: 'com_1', nivel2: 'Setup', nivel3: 'Ambientação', hours: 10, consultants: defaultConsultants },
                { id: 'com_2', nivel2: 'Diagnóstico', nivel3: 'Análise Funil', hours: 10, consultants: defaultConsultants },
                { id: 'com_3', nivel2: 'Processos', nivel3: 'Definição ICP', hours: 10, consultants: defaultConsultants },
                { id: 'com_4', nivel2: 'Processos', nivel3: 'Playbook', hours: 20, consultants: defaultConsultants },
                { id: 'com_5', nivel2: 'Equipe', nivel3: 'Treinamento', hours: s.treino !== 'com_treinoNao' ? 10 : 0, consultants: defaultConsultants },
                { id: 'com_6', nivel2: 'Equipe', nivel3: 'Definição Cargos', hours: s.cargos !== 'com_cargosNao' ? 10 : 0, consultants: defaultConsultants }
            ].filter(t => t.hours > 0);
            return [];
        };

        const CalculadoraView = ({ config, setConfig, onSavePricing, targetLeadContext }) => {
            const initialServices = {
                pesquisa_secundaria: { label: 'Pesquisa Secundária', consultants: 3, complexidadePesquisa: 'ps_simples', custosExtras: 0, customTaskData: {} },
                pesquisa_primaria: { label: 'Pesquisa Primária', consultants: 3, semanasColeta: 2, coleta: 'pp_forms', volume: 'pp_volPequeno', custosExtras: 0, customTaskData: {} },
                comercial: { label: 'Estruturação Comercial', consultants: 3, treino: 'com_treinoNao', cargos: 'com_cargosNao', custosExtras: 0, customTaskData: {} },
                mapeamento: { label: 'Mapeamento de Processos', consultants: 3, interviewees: 10, setores: 'map_setor2', complexidadeTecnica: 'map_profMedia', numeroPops: 0, custosExtras: 0, customTaskData: {} },
                gestao_midias: { label: 'Gestão de Mídias', consultants: 2, mesesContrato: 6, postsPorSemana: 3, trafegoPago: 'gm_trafegoNao', custosExtras: 0, customTaskData: {} },
                servico_dados: { label: 'Serviço de Dados', consultants: 3, complexidadeDados: 'sd_medio', custosExtras: 0, customTaskData: {} },
                novo_escopo: { label: 'Novo Escopo (Livre)', consultants: 3, custosExtras: 0, customTaskData: { 'novo_1': { id: 'novo_1', isNew: true, nivel2: 'Fase 1', nivel3: 'Sprint Principal', hours: 10, consultants: 3 } } }
            };

            const mapServiceTypeToTab = (type) => {
                const map = {
                    'Gestão de Mídias': 'gestao_midias', 'Mapeamento de Processos': 'mapeamento', 
                    'Pesquisa Secundária': 'pesquisa_secundaria', 'Pesquisa Primária': 'pesquisa_primaria',
                    'Dados': 'servico_dados', 'Serviço de Dados': 'servico_dados', 'Estruturação Comercial': 'comercial'
                };
                return map[type] || 'novo_escopo';
            };

            const defaultTab = targetLeadContext?.serviceType ? mapServiceTypeToTab(targetLeadContext.serviceType) : 'mapeamento';

            const [companyType, setCompanyType] = useState('Media'); 
            const [capacity, setCapacity] = useState('cap_40_60'); 
            const [activeTab, setActiveTab] = useState(defaultTab);
            const [selectedServices, setSelectedServices] = useState([]);
            const [services, setServices] = useState(initialServices);

            useEffect(() => {
                if(targetLeadContext?.serviceType) {
                    setActiveTab(mapServiceTypeToTab(targetLeadContext.serviceType));
                    setSelectedServices([]);
                }
            }, [targetLeadContext]);

            const capacityOptions = [ { label: '0-20%', value: 'cap_0_20' }, { label: '20-40%', value: 'cap_20_40' }, { label: '40-60%', value: 'cap_40_60' }, { label: '60-80%', value: 'cap_60_80' }, { label: '80-100%', value: 'cap_80_100' } ];

            const toggleServiceSelection = (id) => setSelectedServices(prev => prev.includes(id) ? prev.filter(s => s !== id) : [...prev, id]);
            const updateService = (service, key, value) => setServices(prev => ({ ...prev, [service]: { ...prev[service], [key]: value } }));
            const handleConfigChange = (key, val) => setConfig(prev => ({ ...prev, [key]: Number(val) }));

            const handleCustomTaskChange = (serviceId, taskId, field, value) => {
                setServices(prev => ({
                    ...prev, 
                    [serviceId]: { 
                        ...prev[serviceId], 
                        customTaskData: { 
                            ...(prev[serviceId].customTaskData || {}), 
                            [taskId]: { 
                                ...(prev[serviceId].customTaskData?.[taskId] || {}), 
                                [field]: value 
                            } 
                        } 
                    }
                }));
            };

            const addCustomTaskRow = (serviceId) => {
                const newId = 'sprint_' + Date.now();
                handleCustomTaskChange(serviceId, newId, 'isNew', true);
                handleCustomTaskChange(serviceId, newId, 'id', newId);
                handleCustomTaskChange(serviceId, newId, 'nivel2', 'Nova Fase');
                handleCustomTaskChange(serviceId, newId, 'nivel3', 'Nova Sprint');
                handleCustomTaskChange(serviceId, newId, 'hours', 10);
                handleCustomTaskChange(serviceId, newId, 'consultants', services[serviceId].consultants || 3);
            };

            const calculateSingleService = (serviceName) => {
                const s = services[serviceName];
                const rate = config[`hora${companyType}`];
                
                const baseTasks = serviceName === 'novo_escopo' ? [] : getEapTasks(serviceName, s);
                
                let tasks = baseTasks.map(t => {
                    const override = s.customTaskData?.[t.id] || {};
                    return {
                        ...t,
                        nivel2: override.nivel2 !== undefined ? override.nivel2 : t.nivel2,
                        nivel3: override.nivel3 !== undefined ? override.nivel3 : t.nivel3,
                        hours: override.hours !== undefined ? override.hours : t.hours,
                        consultants: override.consultants !== undefined ? override.consultants : t.consultants,
                        deleted: override.deleted
                    };
                }).filter(t => !t.deleted);

                const addedTasks = Object.values(s.customTaskData || {})
                    .filter(override => override.isNew && !override.deleted)
                    .map(override => ({
                        id: override.id,
                        nivel2: override.nivel2 || 'Nova Fase',
                        nivel3: override.nivel3 || 'Nova Sprint',
                        hours: override.hours || 10,
                        consultants: override.consultants || s.consultants || 3
                    }));

                tasks = [...tasks, ...addedTasks];

                const totalBaseHours = tasks.reduce((sum, t) => sum + ((t.hours || 0) * (t.consultants || 1)), 0);
                const baseValue = rate * totalBaseHours;
                
                let markupComplexidade = 1;
                if (serviceName !== 'novo_escopo') {
                    let points = 0;
                    Object.keys(s).forEach(key => { if (typeof s[key] === 'string' && config[s[key]] !== undefined) points += config[s[key]]; });
                    markupComplexidade += (points / 100);
                    if (serviceName === 'mapeamento') markupComplexidade *= 1 + ((Number(s.interviewees) - 1) / 19);
                }

                const totalMultiplier = markupComplexidade * (1 + config[capacity]/100);
                const valorComMarkups = baseValue * totalMultiplier;
                let extraFixos = Number(s.custosExtras || 0);
                if (serviceName === 'mapeamento') extraFixos += Number(s.numeroPops) * config.valorPop;
                if (serviceName === 'servico_dados') extraFixos += config.valorIAPro * (tasks.reduce((max, t) => Math.max(max, t.consultants), 0) || s.consultants || 1);

                const final = (valorComMarkups + extraFixos) / ((100 - config.imposto) / 100); 
                return { totalBaseHours, tasks, markupComplexidade, final, extraFixos, effectiveRatePerHour: final / (totalBaseHours || 1) };
            };

            const activeModuleResult = useMemo(() => activeTab === 'tabela_referencia' ? null : calculateSingleService(activeTab), [services, activeTab, companyType, capacity, config]);

            const results = useMemo(() => {
                let totalIdeal = 0; 
                const modulesArray = [];
                const items = {};
                
                selectedServices.forEach(id => { 
                    const res = calculateSingleService(id); 
                    items[id] = res;
                    totalIdeal += res.final; 
                    modulesArray.push({ id, label: services[id].label, final: res.final }); 
                });
                
                return { 
                    items, 
                    ideal: totalIdeal, 
                    aceitavel: totalIdeal * 0.90, 
                    lucroZero: totalIdeal * 0.80, 
                    modules: modulesArray 
                };
            }, [services, companyType, capacity, selectedServices, config]);

            const TabButton = ({ id, label, icon }) => (
                <button onClick={() => setActiveTab(id)} className={`flex-shrink-0 flex items-center justify-center gap-2 px-5 py-4 font-bold transition-all text-xs uppercase tracking-wider rounded-full ${activeTab === id ? 'bg-ufabc-green text-white shadow-lg' : 'bg-transparent text-slate-500 hover:text-ufabc-green hover:bg-slate-200/50'}`}>
                    <i className={`fa-solid ${icon}`}></i> {label} {selectedServices.includes(id) && <i className="fa-solid fa-check text-ufabc-yellow ml-1"></i>}
                </button>
            );

            const MultiplierSelector = ({ label, value, options, onChange, icon }) => (
                <div className="mb-6 bg-white p-6 rounded-3xl border border-slate-200 shadow-sm">
                    <label className="block text-sm font-bold text-ufabc-green mb-4 flex items-center gap-2"><i className={`fa-solid ${icon}`}></i> {label}</label>
                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
                        {options.map(opt => (
                            <button key={opt.value} onClick={() => onChange(opt.value)} className={`px-3 py-3 text-[11px] rounded-xl border-2 transition-all font-bold flex flex-col items-center gap-1.5 ${value === opt.value ? 'bg-ufabc-green border-ufabc-green text-white' : 'bg-slate-50 border-slate-100 text-slate-600 hover:border-ufabc-green/30'}`}>
                                <span className="text-center">{opt.label}</span>
                                <span className={`text-[9px] px-2 py-0.5 rounded-full ${value === opt.value ? 'bg-white/20' : 'bg-slate-200 text-slate-500'}`}>+ {config[opt.value]}%</span>
                            </button>
                        ))}
                    </div>
                </div>
            );

            const ConfigInput = ({ configKey, type = "percent" }) => (
                <div className="flex items-center justify-end gap-1.5">
                    {type === "currency" && <span className="text-xs text-slate-400 font-bold">R$</span>}
                    <input type="number" step={type === "percent" || type === "currency" ? "1" : "0.01"} value={config[configKey]} onChange={(e) => handleConfigChange(configKey, e.target.value)} className="w-20 bg-slate-50 border border-slate-200 rounded-lg px-2 py-2 text-right text-sm font-black text-ufabc-green outline-none focus:ring-2 focus:ring-ufabc-yellow transition-all" />
                    {type === "percent" && <span className="text-xs text-slate-400 font-bold">%</span>}
                </div>
            );

            const saveAndAttach = () => {
                if(targetLeadContext) {
                    onSavePricing(targetLeadContext.id, {
                        ideal: results.ideal,
                        aceitavel: results.aceitavel,
                        lucroZero: results.lucroZero,
                        modules: results.modules
                    });
                }
            };

            return (
                <div className="h-full pb-16 bg-ufabc-bg overflow-y-auto kanban-scroll relative">
                    
                    <div className="px-6 py-4 border-b border-slate-200 bg-white flex justify-between items-center sticky top-0 z-40 shadow-sm">
                        <div className="flex gap-4 items-center">
                            {targetLeadContext ? (
                                <div className="bg-ufabc-yellow/20 border border-ufabc-yellow px-4 py-2 rounded-xl text-ufabc-dark text-sm font-bold flex items-center gap-2">
                                    <i className="fa-solid fa-link"></i> Orçando para: {targetLeadContext.company}
                                </div>
                            ) : <h2 className="text-lg font-semibold text-slate-700">Calculadora de Preços</h2>}
                        </div>
                        <div className="flex gap-3">
                            <select value={companyType} onChange={(e) => setCompanyType(e.target.value)} className="bg-slate-100 border border-slate-200 text-slate-700 rounded-lg px-4 py-2 text-xs font-bold outline-none cursor-pointer"><option value="Micro">Micro/Pequena</option><option value="Media">Média Empresa</option><option value="Grande">Grande/Multi</option></select>
                            <select value={capacity} onChange={(e) => setCapacity(e.target.value)} className="bg-slate-100 border border-slate-200 text-slate-700 rounded-lg px-4 py-2 text-xs font-bold outline-none cursor-pointer">{capacityOptions.map(opt => <option key={opt.value} value={opt.value}>{opt.label}</option>)}</select>
                        </div>
                    </div>

                    <div className="max-w-7xl mx-auto space-y-8 mt-6 px-4 md:px-8 relative z-10">
                        <div className="bg-white p-2 rounded-full shadow-sm border border-slate-200 flex overflow-x-auto w-full no-scrollbar">
                            <TabButton id="pesquisa_secundaria" label="Secundária" icon="fa-database" />
                            <TabButton id="pesquisa_primaria" label="Primária" icon="fa-magnifying-glass" />
                            <TabButton id="comercial" label="Comercial" icon="fa-users" />
                            <TabButton id="mapeamento" label="Mapeamento" icon="fa-chart-column" />
                            <TabButton id="gestao_midias" label="G. Mídias" icon="fa-hashtag" />

        const MainApp = () => {
            const [currentView, setCurrentView] = useState('crm'); 
            const [leads, setLeads] = useState([]);
            const [pricingTargetLeadContext, setPricingTargetLeadContext] = useState(null); 

            const [pricingConfig, setPricingConfig] = useState({
                "imposto": 3, "horaMicro": 20, "horaMedia": 30, "horaGrande": 40,
                "cap_0_20": -15, "cap_20_40": -5, "cap_40_60": 0, "cap_60_80": 15, "cap_80_100": 30,
                "valorPop": 200, "valorIAPro": 200, 
                "ps_simples": 0, "ps_nichado": 15, "ps_complexo": 30,
                "pp_forms": 0, "pp_ligacao": 15, "pp_presencial": 30, 
                "pp_volPequeno": 0, "pp_volMedio": 15, "pp_volGrande": 30,
                "com_treinoNao": 0, "com_treinoSim": 20, 
                "com_cargosNao": 0, "com_cargosSim": 15, 
                "map_profBasica": 0, "map_profMedia": 10, "map_profEstrategica": 20, 
                "map_setor2": 0, "map_setor5": 10, "map_setorMais5": 20, 
                "sd_simples": 0, "sd_medio": 15, "sd_complexo": 30, 
                "gm_trafegoNao": 0, "gm_trafegoSim": 50 
            });

            useEffect(() => {
                if (window.db && window.onSnapshot && window.collection) {
                    const unsubscribe = window.onSnapshot(window.collection(window.db, 'leads'), (snapshot) => { 
                        setLeads(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }))); 
                    });
                    return () => unsubscribe();
                } else {
                    const saved = localStorage.getItem('ufabc_jr_integrated_leads');
                    setLeads(saved ? JSON.parse(saved) : INITIAL_LEADS);
                }
            }, []);

            useEffect(() => {
                if (!window.db && leads.length > 0) localStorage.setItem('ufabc_jr_integrated_leads', JSON.stringify(leads));
            }, [leads]);

            const saveLeadToDB = (leadData, isNew = false) => {
                // Atualização otimista local imediata (evita o visual de duplicação/atraso no drag-and-drop)
                setLeads(prev => {
                    const exists = prev.some(l => l.id === leadData.id);
                    return exists ? prev.map(l => l.id === leadData.id ? leadData : l) : [leadData, ...prev];
                });

                if (window.db && window.doc && window.setDoc) {
                    window.setDoc(window.doc(window.db, 'leads', leadData.id), leadData, { merge: true })
                        .catch(e => console.error("Erro ao salvar no Firebase:", e));
                }
            };

            const deleteLeadFromDB = (leadId) => {
                // Atualização otimista local imediata
                setLeads(prev => prev.filter(l => l.id !== leadId));

                if (window.db && window.doc && window.deleteDoc) {
                    window.deleteDoc(window.doc(window.db, 'leads', leadId))
                        .catch(e => console.error("Erro ao deletar no Firebase:", e));
                }
            };

            const handleNavigateToPricing = (leadId, company, serviceType) => {
                setPricingTargetLeadContext({ id: leadId, company, serviceType });
                setCurrentView('pricing');
            };

            const handleSavePricingToLead = (leadId, pricingResultData) => {
                // Ao clicar em integrar, buscamos o lead e salvamos
                const leadToUpdate = leads.find(l => l.id === leadId);
                if(leadToUpdate) {
                    saveLeadToDB({ ...leadToUpdate, savedPricing: pricingResultData });
                }
                setCurrentView('crm');
                setPricingTargetLeadContext(null);
            };

            return (
                <div className="h-screen flex flex-col font-sans bg-ufabc-bg">
                    <header className="bg-ufabc-dark w-full shadow-md border-b-4 border-ufabc-yellow flex-shrink-0 z-50">
                        <div className="px-6 py-3 flex flex-col sm:flex-row justify-between items-center gap-4">
                            <div className="flex items-center gap-4">
                                <LogoUFABC isDarkBg={true} className="text-xl sm:text-2xl" />
                                <div className="hidden sm:block w-px h-6 bg-gray-600"></div>
                                <h1 className="hidden sm:block text-base font-medium text-slate-200">Funil Comercial e API de Precificação</h1>
                            </div>
                            <div className="flex bg-black/40 p-1.5 rounded-2xl shadow-inner w-full sm:w-auto">
                                <button onClick={() => setCurrentView('crm')} className={`flex-1 sm:flex-none px-6 py-2.5 rounded-xl text-xs font-bold transition-all flex justify-center items-center gap-2 ${currentView === 'crm' ? 'bg-ufabc-green text-white shadow' : 'text-slate-400 hover:text-white hover:bg-white/5'}`}>
                                    <i className="fa-solid fa-filter"></i> Funil Comercial
                                </button>
                                <button onClick={() => { setCurrentView('pricing'); setPricingTargetLeadContext(null); }} className={`flex-1 sm:flex-none px-6 py-2.5 rounded-xl text-xs font-bold transition-all flex justify-center items-center gap-2 ${currentView === 'pricing' ? 'bg-ufabc-green text-white shadow' : 'text-slate-400 hover:text-white hover:bg-white/5'}`}>
                                    <i className="fa-solid fa-calculator"></i> Precificação
                                </button>
                            </div>
                        </div>
                    </header>
                    <main className="flex-1 relative overflow-hidden">
                        <div className={`absolute inset-0 ${currentView === 'crm' ? 'block' : 'hidden'}`}>
                            <CRMView leads={leads} saveLeadToDB={saveLeadToDB} deleteLeadFromDB={deleteLeadFromDB} onNavigateToPricing={handleNavigateToPricing} />
                        </div>
                        <div className={`absolute inset-0 ${currentView === 'pricing' ? 'block' : 'hidden'}`}>
                            <CalculadoraView config={pricingConfig} setConfig={setPricingConfig} targetLeadContext={pricingTargetLeadContext} onSavePricing={handleSavePricingToLead} />
                        </div>
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<MainApp />);
    </script>
</body>
